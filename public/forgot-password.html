<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — ShopEase</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div id="site-header"></div>

<div class="form-card">
  <h1>Reset your password</h1>
  <p class="sub">Enter your email or mobile and we'll send you a reset link.</p>
  <div class="form-error" id="form-error"></div>
  <div id="success-box" style="display:none; background:#dcfce7; color:#166534; padding:12px; border-radius:8px; font-size:13.5px; margin-bottom:16px;"></div>
  <form id="forgot-form">
    <div class="field">
      <label for="identifier">Email or Mobile Number</label>
      <input type="text" id="identifier" required>
    </div>
    <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Send Reset Link</button>
  </form>
  <p class="form-note"><a href="/login.html">Back to login</a></p>
</div>

<div id="site-footer"></div>

<script src="/js/api.js"></script>
<script src="/js/common.js"></script>
<script src="/js/auth-pages.js"></script>
</body>
</html>
