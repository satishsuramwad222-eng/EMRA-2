<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard — ShopEase</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div id="page-content">
  <div class="admin-toolbar"><h1>Dashboard Overview</h1></div>
  <div class="stat-grid" id="stat-grid"><div class="spinner"></div></div>

  <div class="panel">
    <h3 style="margin-top:0;">Recent Orders</h3>
    <div class="table-wrap">
      <table class="admin-table">
        <thead><tr><th>Order ID</th><th>Date</th><th>Status</th><th>Total</th></tr></thead>
        <tbody id="recent-orders-body"><tr><td colspan="4">Loading...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/admin/common.js"></script>
<script src="/js/admin/dashboard.js"></script>
</body>
</html>
