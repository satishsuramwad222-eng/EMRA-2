<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — ShopEase</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body style="background:var(--blue-900); min-height:100vh;">

<div class="form-card" style="margin-top:80px;">
  <h1>Admin Login</h1>
  <p class="sub">Restricted access — store administrators only.</p>
  <div class="form-error" id="form-error"></div>
  <form id="admin-login-form">
    <div class="field">
      <label for="email">Admin Email</label>
      <input type="email" id="email" required autocomplete="username">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" required autocomplete="current-password">
    </div>
    <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Log In</button>
  </form>
</div>

<script src="/js/api.js"></script>
<script>
document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errEl = document.getElementById('form-error');
  errEl.classList.remove('show');
  const btn = document.getElementById('submit-btn');
  btn.disabled = true; btn.textContent = 'Logging in...';
  try {
    await api('/api/admin/login', { method: 'POST', body: {
      email: document.getElementById('email').value.trim(),
      password: document.getElementById('password').value,
    }});
    location.href = '/admin/dashboard.html';
  } catch (err) {
    errEl.textContent = err.message;
    errEl.classList.add('show');
    btn.disabled = false; btn.textContent = 'Log In';
  }
});
</script>
</body>
</html>
