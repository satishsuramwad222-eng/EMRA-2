<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Products — ShopEase Admin</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div id="page-content">
  <div class="admin-toolbar">
    <h1>Products</h1>
    <button class="btn btn-accent" id="add-product-btn">+ Add Product</button>
  </div>

  <div class="table-wrap panel" style="padding:0;">
    <table class="admin-table">
      <thead><tr><th>Image</th><th>ID</th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>GST%</th><th>Discount%</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody id="products-body"><tr><td colspan="10">Loading...</td></tr></tbody>
    </table>
  </div>
  <div class="modal-overlay" id="product-modal" hidden>
    <div class="modal-box" style="max-width:520px;">
      <h2 id="modal-title">Add Product</h2>
      <div class="form-error" id="product-form-error"></div>
      <form id="product-form" enctype="multipart/form-data">
        <input type="hidden" id="p-id">
        <div class="field"><label>Product Name</label><input type="text" id="p-name" required></div>
        <div class="field-row">
          <div class="field"><label>Category</label><input type="text" id="p-category" required list="cat-list"><datalist id="cat-list"></datalist></div>
          <div class="field"><label>Price (₹)</label><input type="number" id="p-price" min="0" step="0.01" required></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Stock Quantity</label><input type="number" id="p-stock" min="0" step="1" required></div>
          <div class="field"><label>GST %</label><input type="number" id="p-gst" min="0" max="28" step="0.5" required></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Discount %</label><input type="number" id="p-discount" min="0" max="90" step="1" value="0"></div>
          <div class="field"><label>Status</label>
            <select id="p-status"><option value="active">Active</option><option value="inactive">Inactive</option></select>
          </div>
        </div>
        <div class="field"><label>Description</label><textarea id="p-description" rows="3"></textarea></div>
        <div class="field"><label>Product Image</label><input type="file" id="p-image" accept="image/*"></div>
        <div class="modal-actions">
          <button type="button" class="btn btn-outline" id="modal-cancel">Cancel</button>
          <button type="submit" class="btn btn-primary" id="modal-save">Save Product</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/admin/common.js"></script>
<script src="/js/admin/products.js"></script>
</body>
</html>
