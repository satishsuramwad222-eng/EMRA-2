<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shipping Policy — ShopEase</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div id="site-header"></div>
<div class="container" style="max-width:760px; padding-top:30px; padding-bottom:50px;">
  <h1 class="page-title">Shipping Policy</h1>
  <div class="panel" id="shipping-panel"><div class="spinner"></div></div>
</div>
<div id="site-footer"></div>
<script src="/js/api.js"></script>
<script src="/js/common.js"></script>
<script>
(async()=>{
  await ShopEase.init();
  const c = await ShopEase.loadConfig();
  document.getElementById('shipping-panel').innerHTML = `
    <p>Orders are typically delivered within <strong>${c.estimatedDeliveryDays} days</strong> of being placed, depending on your location and product availability.</p>
    <p>You can track your order any time from the <a href="/orders.html" style="color:var(--blue-700); font-weight:700;">My Orders</a> page — every order shows a live status timeline from "Order Placed" through "Delivered".</p>
    <p style="color:var(--gray-500); font-size:12.5px;">This is placeholder policy text — update it with your actual courier partners, shipping charges and delivery-area details.</p>
  `;
})();
</script>
</body>
</html>
