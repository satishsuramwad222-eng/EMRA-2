<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us — ShopEase</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div id="site-header"></div>
<div class="container" style="max-width:760px; padding-top:30px; padding-bottom:50px;">
  <h1 class="page-title">Contact Us</h1>
  <div class="panel" id="contact-panel">
    <div class="spinner"></div>
  </div>
</div>
<div id="site-footer"></div>
<script src="/js/api.js"></script>
<script src="/js/common.js"></script>
<script>
(async()=>{
  await ShopEase.init();
  const c = await ShopEase.loadConfig();
  document.getElementById('contact-panel').innerHTML = `
    <p><strong>Customer Care:</strong> ${ShopEase.escapeHtml(c.company.customerCareNumber)}</p>
    <p><strong>Email:</strong> ${ShopEase.escapeHtml(c.company.email)}</p>
    <p><strong>WhatsApp:</strong> <a href="https://wa.me/${c.whatsappNumber}" target="_blank" rel="noopener" style="color:var(--blue-700); font-weight:700;">+${ShopEase.escapeHtml(c.whatsappNumber)}</a></p>
    <p><strong>Support Hours:</strong> ${ShopEase.escapeHtml(c.company.supportHours)}</p>
    <p><strong>Address:</strong><br>${ShopEase.escapeHtml(c.company.address)}</p>
  `;
})();
</script>
</body>
</html>
