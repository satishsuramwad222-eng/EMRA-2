<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — ShopEase</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div id="site-header"></div>

<div class="form-card">
  <h1>Choose a new password</h1>
  <p class="sub">Enter a new password for your account.</p>
  <div class="form-error" id="form-error"></div>
  <div id="success-box" style="display:none; background:#dcfce7; color:#166534; padding:12px; border-radius:8px; font-size:13.5px; margin-bottom:16px;"></div>
  <form id="reset-form">
    <div class="field">
      <label for="password">New Password</label>
      <input type="password" id="password" required minlength="8">
    </div>
    <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Update Password</button>
  </form>
</div>

<div id="site-footer"></div>

<script src="/js/api.js"></script>
<script src="/js/common.js"></script>
<script src="/js/auth-pages.js"></script>
</body>
</html>
