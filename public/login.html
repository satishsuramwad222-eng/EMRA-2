<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — ShopEase</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div id="site-header"></div>

<div class="form-card">
  <h1>Welcome back</h1>
  <p class="sub">Log in to continue shopping.</p>
  <div class="form-error" id="form-error"></div>
  <form id="login-form">
    <div class="field">
      <label for="identifier">Email or Mobile Number</label>
      <input type="text" id="identifier" required autocomplete="username">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" required autocomplete="current-password">
    </div>
    <p style="text-align:right; margin:-8px 0 16px;"><a href="/forgot-password.html" style="font-size:13px; color:var(--blue-700); font-weight:700;">Forgot password?</a></p>
    <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Log In</button>
  </form>
  <p class="form-note">New here? <a href="/register.html">Create an account</a></p>
</div>

<div id="site-footer"></div>

<script src="/js/api.js"></script>
<script src="/js/common.js"></script>
<script src="/js/auth-pages.js"></script>
</body>
</html>
