<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — ShopEase</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div id="site-header"></div>

<div class="form-card" style="max-width:520px;">
  <h1>Create your account</h1>
  <p class="sub">Join ShopEase for a faster checkout experience.</p>
  <div class="form-error" id="form-error"></div>
  <form id="register-form">
    <div class="field">
      <label for="name">Full Name</label>
      <input type="text" id="name" required>
    </div>
    <div class="field-row">
      <div class="field">
        <label for="email">Email ID</label>
        <input type="email" id="email" required>
      </div>
      <div class="field">
        <label for="mobile">Mobile Number</label>
        <input type="tel" id="mobile" required>
      </div>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" required minlength="8">
    </div>
    <h3 style="font-size:13px; color:var(--gray-500); text-transform:uppercase; margin:18px 0 8px;">Delivery Address (optional now, required before ordering)</h3>
    <div class="field">
      <label for="line1">Address Line 1</label>
      <input type="text" id="line1">
    </div>
    <div class="field-row">
      <div class="field">
        <label for="city">City</label>
        <input type="text" id="city">
      </div>
      <div class="field">
        <label for="state">State</label>
        <input type="text" id="state">
      </div>
    </div>
    <div class="field">
      <label for="pincode">Pincode</label>
      <input type="text" id="pincode">
    </div>
    <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Create Account</button>
  </form>
  <p class="form-note">Already have an account? <a href="/login.html">Log in</a></p>
</div>

<div id="site-footer"></div>

<script src="/js/api.js"></script>
<script src="/js/common.js"></script>
<script src="/js/auth-pages.js"></script>
</body>
</html>
